<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBILE UPLOAD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f0e6;
            color: #000;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
        }

        header h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 12px;
            opacity: 0.7;
        }

        .section {
            margin-bottom: 16px;
            padding: 14px;
            border: 2px solid #000;
            background-color: #f5f0e6;
        }

        .section h2 {
            font-size: 16px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        input[type="password"],
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 9px;
            margin-bottom: 10px;
            background-color: #f5f0e6;
            color: #000;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        input[type="password"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .mode-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background-color: #f5f0e6;
            color: #000;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            background-color: #000;
            color: #fff;
        }

        .mode-btn.active {
            background-color: #000;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .file-upload-area {
            border: 2px dashed #000;
            padding: 18px;
            text-align: center;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #f9f9f9;
        }

        .file-upload-area:hover {
            background-color: #ebe5d6;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .file-upload-area.drag-over {
            background-color: #000;
            color: #fff;
        }

        .file-input {
            display: none;
        }

        .file-name {
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.8;
        }

        .image-preview {
            margin-top: 10px;
            display: none;
            text-align: center; /* Center the image horizontally */
        }

        .image-preview.visible {
            display: block;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid #000;
            display: block; /* Make image a block element */
            margin: 0 auto; /* Center the image */
            object-fit: contain; /* Maintain aspect ratio */
        }

        .metadata-fields {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #000;
        }

        .metadata-fields.visible {
            display: block;
        }

        .metadata-field {
            margin-bottom: 10px;
        }

        .metadata-field label {
            margin-bottom: 4px;
        }

        .metadata-field input[type="text"],
        .metadata-field input[type="number"] {
            margin-bottom: 0;
        }

        /* PERFORMANCE: CSS class for metadata select (avoid inline styles) */
        .metadata-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 0;
            background-color: #f5f0e6;
            color: #000;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: 2px solid #000;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border: 2px solid #000;
            background-color: #f5f0e6;
        }

        .results.visible {
            display: block;
        }

        .results h2 {
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 16px;
        }

        .result-item {
            border: 3px solid #000;
            padding: 10px;
            background-color: #f5f0e6;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #000;
        }

        .result-image {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border: 2px solid #000;
            background: #ebe5d6;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }

        .result-info h3 {
            font-size: 14px;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .result-meta {
            font-size: 11px;
            opacity: 0.9;
            line-height: 1.35;
            word-break: break-word;
        }

        .result-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 10px;
        }

        .result-summary-item {
            border: 2px solid #000;
            background: #ebe5d6;
            padding: 6px;
            text-align: center;
        }

        .result-summary-item .value {
            display: block;
            font-weight: bold;
            font-size: 13px;
        }

        .result-summary-item .label {
            display: block;
            font-size: 10px;
            margin-top: 2px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }

        .match-card {
            border: 2px solid #000;
            padding: 6px;
            background: #f9f9f9;
        }

        .match-image {
            width: 100%;
            height: 88px;
            object-fit: cover;
            border: 2px solid #000;
            margin-bottom: 6px;
            background: #ebe5d6;
        }

        .match-score {
            display: inline-block;
            padding: 3px 6px;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .score-high {
            background: #000;
            color: #fff;
        }

        .score-medium {
            background: #ebe5d6;
            color: #000;
        }

        .score-low {
            background: #f5f0e6;
            color: #000;
        }

        .duplicate-badge {
            display: inline-block;
            padding: 2px 5px;
            background: #000;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            margin-left: 4px;
            vertical-align: top;
        }

        .match-info {
            font-size: 10px;
            line-height: 1.35;
            word-break: break-word;
        }

        .match-name {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .match-metadata-scores {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 5px;
        }

        .metadata-tag {
            display: inline-block;
            border: 1px solid #000;
            padding: 2px 4px;
            font-size: 9px;
            background: #ebe5d6;
        }

        .no-matches {
            text-align: center;
            padding: 12px;
            border: 2px dashed #000;
            background: #f9f9f9;
            font-size: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 12px 0;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            border: 2px solid #000;
            border-top: 2px solid #f0f0f0;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #000;
            text-align: center;
            font-size: 13px;
        }

        .message.success {
            background-color: #ebe5d6;
        }

        .message.error {
            color: #000;
            border-color: #000;
            background-color: #f5f0e6;
        }

        .message.info {
            background-color: #f9f9f9;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            header h1 {
                font-size: 18px;
            }

            .section {
                padding: 10px;
            }

            .mode-buttons {
                flex-direction: column;
            }

            .mode-btn {
                margin-bottom: 10px;
            }
        }
    </style>

    <!-- Lucide Icons (pinned version for better caching) -->
    <!-- Lucide Icons (latest stable version) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="compact-ui">
    <div class="container">
        <header>
            <h1><i data-lucide="smartphone" style="width: 20px; height: 20px; vertical-align: middle;"></i> MOBILE UPLOAD</h1>
            <p>Upload products and get instant matches</p>
        </header>

        <!-- Auth Section -->
        <div class="section">
            <h2><i data-lucide="lock" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px;"></i>Authentication</h2>
            <label for="password">Password (6 digits)</label>
            <input
                type="password"
                id="password"
                placeholder="000000"
                maxlength="6"
                autocomplete="off"
            >
            <button class="btn-primary" onclick="authenticate()"><i data-lucide="check" style="width: 16px; height: 16px; vertical-align: middle;"></i> AUTHENTICATE</button>
            <div id="authMessage"></div>
        </div>

        <!-- Catalog & Mode Selection (hidden until authenticated) -->
        <div id="uploadSection" style="display: none;">
            <!-- Catalog Selection -->
            <div class="section">
                <h2><i data-lucide="folder" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px;"></i>Catalog Selection</h2>
                <label for="catalogSelect">Select Catalog</label>
                <select id="catalogSelect" onchange="handleCatalogChange()">
                    <option value="">Loading catalogs...</option>
                </select>
            </div>

            <!-- Mode Selection -->
            <div class="section">
                <h2><i data-lucide="sliders" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px;"></i>Matching Mode</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" onclick="selectMode('mode1')">
                        <i data-lucide="eye" style="width: 20px; height: 20px; display: block; margin: 0 auto 5px;"></i>
                        MODE 1<br>
                        <span style="font-size: 11px; opacity: 0.7;">Visual Only</span>
                    </button>
                    <button class="mode-btn" onclick="selectMode('mode3')">
                        <i data-lucide="git-merge" style="width: 20px; height: 20px; display: block; margin: 0 auto 5px;"></i>
                        MODE 3<br>
                        <span style="font-size: 11px; opacity: 0.7;">Visual + Metadata</span>
                    </button>
                </div>
            </div>

            <!-- Photo Upload -->
            <div class="section">
                <h2><i data-lucide="camera" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px;"></i>Photo Upload</h2>
                <div class="file-upload-area" onclick="document.getElementById('photoInput').click()">
                    <div><i data-lucide="camera" style="width: 32px; height: 32px; vertical-align: middle;"></i> TAP TO TAKE PHOTO OR SELECT FROM GALLERY</div>
                    <div class="file-name" id="fileName"></div>
                </div>
                <input
                    type="file"
                    id="photoInput"
                    class="file-input"
                    accept="image/*"
                    capture="camera"
                    onchange="handleFileSelect(event)"
                >
                <div class="image-preview" id="imagePreview">
                    <img id="previewImage" alt="Preview">
                </div>
            </div>

            <!-- Product Info (Mode 3 Only) -->
            <div class="section" id="productInfoSection" style="display: none;">
                <h2><i data-lucide="info" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px;"></i>Product Information</h2>

                <!-- Base fields - only shown if no metadata schema -->
                <div id="baseFields">
                    <label for="category">Category (Optional)</label>
                    <select id="category">
                        <option value="">-- Select Category --</option>
                    </select>

                    <label for="productName">Product Name (Optional)</label>
                    <input type="text" id="productName" placeholder="e.g., Sony Camera">

                    <label for="sku">SKU (Optional)</label>
                    <input type="text" id="sku" placeholder="e.g., SKU-123">
                </div>

                <!-- Dynamic Metadata Fields (Mode 3 Only) -->
                <div id="metadataContainer" class="metadata-fields">
                    <h3 style="margin-bottom: 15px;">Product Metadata</h3>
                    <div id="metadataFields"></div>
                </div>
            </div>

            <!-- Upload Button -->
            <button class="btn-primary" onclick="uploadProduct()" id="uploadBtn" disabled>
                <i data-lucide="upload" style="width: 16px; height: 16px; vertical-align: middle;"></i> UPLOAD & MATCH
            </button>

            <!-- Loading Indicator -->
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <div>Processing...</div>
            </div>

            <!-- Messages -->
            <div id="messageContainer"></div>

            <!-- Results -->
            <div id="resultsContainer" class="results" style="display: none;">
                <h2>Results</h2>
                <div id="matchResults"></div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        let selectedCatalog = null;
        let selectedMode = null;
        let selectedFile = null;
        let currentCatalogSchema = null;
        let domCache = null;
        let messageTimeout = null;
        let catalogChangeDebounce = null;

        // PERFORMANCE: Category caching to avoid redundant API calls
        let cachedCategories = null;
        let cachedCatalogId = null;

        // Keep client-to-server logging bounded so diagnostics do not degrade UX.
        const mobileLogConfig = {
            debug: new URLSearchParams(window.location.search).get('debug_logs') === '1',
            infoSampleRate: 0.15,
            minSendIntervalMs: 500,
            maxPerMinute: 80,
            maxInFlight: 2
        };
        let mobileLogState = {
            lastSentAt: 0,
            windowStart: Date.now(),
            sentInWindow: 0,
            inFlight: 0
        };

        function sanitizeLogData(data, maxKeys = 10) {
            if (!data || typeof data !== 'object') return null;

            const sanitized = {};
            let count = 0;
            Object.entries(data).forEach(([key, value]) => {
                if (count >= maxKeys) return;
                if (value === null || value === undefined) return;

                if (typeof value === 'number' || typeof value === 'boolean') {
                    sanitized[key] = value;
                } else if (typeof value === 'string') {
                    sanitized[key] = value.length > 120 ? `${value.substring(0, 120)}...` : value;
                } else if (Array.isArray(value)) {
                    sanitized[key] = `array(${value.length})`;
                } else if (typeof value === 'object') {
                    sanitized[key] = 'object';
                } else {
                    sanitized[key] = String(value).substring(0, 120);
                }
                count += 1;
            });

            return sanitized;
        }

        // FIX: Cache DOM references for better performance
        function initDOMCache() {
            domCache = {
                uploadBtn: document.getElementById('uploadBtn'),
                loadingIndicator: document.getElementById('loadingIndicator'),
                photoInput: document.getElementById('photoInput'),
                fileName: document.getElementById('fileName'),
                imagePreview: document.getElementById('imagePreview'),
                previewImage: document.getElementById('previewImage'),
                metadataFields: document.getElementById('metadataFields'),
                metadataContainer: document.getElementById('metadataContainer'),
                productInfoSection: document.getElementById('productInfoSection'),
                category: document.getElementById('category'),
                productName: document.getElementById('productName'),
                sku: document.getElementById('sku'),
                messageContainer: document.getElementById('messageContainer'),
                resultsContainer: document.getElementById('resultsContainer'),
                matchResults: document.getElementById('matchResults'),
                uploadSection: document.getElementById('uploadSection'),
                baseFields: document.getElementById('baseFields')
            };
        }

        // Server-side logging helper
        function serverLog(level, message, data = null) {
            const normalizedLevel = String(level || 'info').toLowerCase();
            const safeMessage = String(message || '').substring(0, 200);

            // Always show locally; sending to server is rate-limited below.
            if (mobileLogConfig.debug || normalizedLevel !== 'info') {
                console.log(`[${normalizedLevel.toUpperCase()}] ${safeMessage}`, data || '');
            }

            // Never send logs before authentication.
            if (!authToken) return;

            // In normal mode, sample noisy info/debug logs.
            if (!mobileLogConfig.debug && (normalizedLevel === 'info' || normalizedLevel === 'debug')) {
                if (Math.random() > mobileLogConfig.infoSampleRate) return;
            }

            const now = Date.now();
            if (now - mobileLogState.windowStart >= 60000) {
                mobileLogState.windowStart = now;
                mobileLogState.sentInWindow = 0;
            }

            // Keep hard limits on send rate and concurrent requests.
            const minInterval = normalizedLevel === 'error' ? 0 : mobileLogConfig.minSendIntervalMs;
            if (now - mobileLogState.lastSentAt < minInterval) return;
            if (mobileLogState.sentInWindow >= mobileLogConfig.maxPerMinute) return;
            if (mobileLogState.inFlight >= mobileLogConfig.maxInFlight) return;

            const payload = {
                level: normalizedLevel,
                message: safeMessage,
                data: sanitizeLogData(data)
            };

            mobileLogState.lastSentAt = now;
            mobileLogState.sentInWindow += 1;
            mobileLogState.inFlight += 1;

            fetch('/api/mobile/log', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Mobile-Session': authToken
                },
                body: JSON.stringify(payload)
            })
            .catch(err => {
                if (mobileLogConfig.debug) {
                    console.warn('Failed to send log to server:', err);
                }
            })
            .finally(() => {
                mobileLogState.inFlight = Math.max(0, mobileLogState.inFlight - 1);
            });
        }

        // Debug helper - shows current state
        window.showDebugState = function() {
            const state = {
                authToken: authToken ? '✓ Set' : '❌ Not set',
                selectedCatalog: selectedCatalog || '❌ Not selected',
                selectedMode: selectedMode || '❌ Not selected',
                selectedFile: selectedFile ? `✓ ${selectedFile.name}` : '❌ No file',
                metadataFieldsCount: currentCatalogSchema?.metadata_fields?.length || 0,
                metadataFields: currentCatalogSchema?.metadata_fields?.map(f => f.column_name) || [],
                uploadBtnDisabled: document.getElementById('uploadBtn')?.disabled
            };
            console.log('=== CURRENT STATE ===', state);
            serverLog('info', 'Debug state requested', state);
            return state;
        };

        async function authenticate() {
            const password = document.getElementById('password').value.trim();
            const messageEl = document.getElementById('authMessage');

            if (!password) {
                showMessage('messageContainer', 'Enter password', 'error');
                return;
            }

            if (password.length !== 6 || !/^\d{6}$/.test(password)) {
                showMessage('messageContainer', 'Password must be 6 digits', 'error');
                return;
            }

            try {
                const response = await fetch('/api/mobile/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (!response.ok) {
                    const retryAfter = data?.details?.retry_after_seconds;
                    if (response.status === 429 && retryAfter) {
                        showMessage('messageContainer', `Too many attempts. Try again in ${retryAfter}s`, 'error');
                    } else {
                        showMessage('messageContainer', data.error || 'Invalid password', 'error');
                    }
                    return;
                }

                if (!data.session_token) {
                    showMessage('messageContainer', 'Auth succeeded but no session token returned', 'error');
                    return;
                }
                authToken = data.session_token;

                showMessage('messageContainer', 'Authenticated successfully', 'success');
                document.getElementById('uploadSection').style.display = 'block';

                // FIX: Initialize DOM cache for performance
                initDOMCache();

                // Load catalogs
                await loadCatalogs(data.catalogs);
            } catch (error) {
                console.error('Auth error:', error);
                showMessage('messageContainer', 'Authentication failed', 'error');
            }
        }

        async function loadCatalogs(catalogs) {
            const select = document.getElementById('catalogSelect');

            // Temporarily remove onchange to prevent triggering during population
            const originalOnChange = select.onchange;
            select.onchange = null;

            select.innerHTML = '<option value="">Select a catalog...</option>';

            let loadedCatalog = null;
            const loadedCatalogs = catalogs.filter(c => c.is_loaded);

            serverLog('info', 'Loading catalogs', {
                totalCount: catalogs.length,
                loadedCount: loadedCatalogs.length,
                loadedNames: loadedCatalogs.map(c => c.name)
            });

            catalogs.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = `${cat.name} (${cat.product_count} products)`;
                if (cat.is_loaded) {
                    option.textContent += ' [LOADED]';
                    loadedCatalog = cat.id; // Remember the loaded catalog
                }
                select.appendChild(option);

                // Debug: Log each catalog option
                serverLog('info', 'Added catalog option', {
                    id: cat.id,
                    name: cat.name,
                    isLoaded: cat.is_loaded
                });
            });

            // Restore onchange handler
            select.onchange = originalOnChange;

            // Auto-select the loaded catalog if there's only one
            if (loadedCatalog && loadedCatalogs.length === 1) {
                serverLog('info', 'Auto-selecting single loaded catalog', { catalog: loadedCatalog });
                select.value = loadedCatalog;
                // Trigger the change event to load schema and categories
                await handleCatalogChange();
            } else if (loadedCatalogs.length > 1) {
                serverLog('warning', 'Multiple loaded catalogs found - user must select manually', {
                    catalogs: loadedCatalogs.map(c => c.name)
                });
            } else {
                serverLog('info', 'No loaded catalog found - user must select from dropdown');
            }
        }

        async function handleCatalogChange() {
            // FIX: Debounce rapid catalog changes to prevent redundant API calls
            if (catalogChangeDebounce) {
                clearTimeout(catalogChangeDebounce);
            }

            const selectElement = document.getElementById('catalogSelect');
            const newCatalog = selectElement.value;

            // Skip if catalog hasn't actually changed
            if (newCatalog === selectedCatalog) {
                serverLog('info', 'Catalog unchanged, skipping');
                return;
            }

            // Debounce the actual change
            catalogChangeDebounce = setTimeout(async () => {
                await handleCatalogChangeImpl(selectElement, newCatalog);
                catalogChangeDebounce = null;
            }, 300);
        }

        async function handleCatalogChangeImpl(selectElement, newCatalog) {
            // Debug: Log dropdown state
            serverLog('info', 'handleCatalogChange called', {
                value: newCatalog || '(empty)',
                selectedIndex: selectElement.selectedIndex,
                optionsCount: selectElement.options.length,
                selectedText: selectElement.options[selectElement.selectedIndex]?.text || '(none)'
            });

            selectedCatalog = newCatalog;
            serverLog('info', 'Catalog selection changed', { catalog: selectedCatalog || '(none)' });

            if (!selectedCatalog || selectedCatalog.trim() === '') {
                // Clear fields when no catalog is selected
                document.getElementById('metadataFields').innerHTML = '';
                document.getElementById('category').innerHTML = '<option value="">-- Select Category --</option>';
                currentCatalogSchema = null;
                // PERFORMANCE FIX: Clear category cache when catalog deselected
                cachedCategories = null;
                cachedCatalogId = null;
                document.getElementById('metadataContainer').classList.remove('visible');
                updateUploadButton();
                return;
            }

            // FIX: Fetch categories FIRST before loading schema/metadata fields
            // This ensures updateMetadataFields() has fresh categories when creating dropdowns
            if (cachedCatalogId !== selectedCatalog) {
                try {
                    serverLog('info', 'Fetching categories for:', { catalog: selectedCatalog });
                    // Add timestamp to prevent browser caching stale data
                    const response = await fetch(
                        `/api/mobile/catalog-categories?catalog_id=${selectedCatalog}&_t=${Date.now()}`,
                        {
                            headers: { 'X-Mobile-Session': authToken }
                        }
                    );

                    if (response.ok) {
                        const data = await response.json();

                        // Cache categories for reuse
                        cachedCategories = data.categories || [];
                        cachedCatalogId = selectedCatalog;

                        const categorySelect = document.getElementById('category');
                        categorySelect.innerHTML = '<option value="">-- Select Category --</option>';

                        cachedCategories.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category;
                            option.textContent = category;
                            categorySelect.appendChild(option);
                        });

                        serverLog('info', 'Categories fetched and cached', {
                            count: cachedCategories.length,
                            categories: cachedCategories
                        });
                    } else {
                        serverLog('error', 'Failed to load categories', { status: response.status });
                        cachedCategories = [];
                    }
                } catch (error) {
                    serverLog('error', 'Categories load error', { error: error.message });
                    cachedCategories = [];
                }
            } else {
                serverLog('info', 'Using cached categories', {
                    count: cachedCategories?.length || 0
                });
            }

            // NOW load catalog schema for metadata fields (categories are already cached)
            try {
                serverLog('info', 'Fetching catalog schema', { catalog: selectedCatalog });
                const response = await fetch(
                    `/api/mobile/catalog-schema?catalog_id=${selectedCatalog}`,
                    {
                        headers: { 'X-Mobile-Session': authToken }
                    }
                );

                if (response.ok) {
                    currentCatalogSchema = await response.json();
                    const metadataCount = currentCatalogSchema.metadata_fields ? currentCatalogSchema.metadata_fields.length : 0;
                    const metadataNames = currentCatalogSchema.metadata_fields ? currentCatalogSchema.metadata_fields.map(f => f.column_name) : [];

                    serverLog('info', 'Catalog schema loaded', {
                        metadataFieldsCount: metadataCount,
                        metadataFields: metadataNames
                    });

                    // Categories are already fetched above, so updateMetadataFields() will use correct cache
                    await updateMetadataFields();

                    // Show metadata container if Mode 3 is selected
                    if (selectedMode === 'mode3') {
                        serverLog('info', 'Mode 3 active, showing metadata container');
                        document.getElementById('metadataContainer').classList.add('visible');
                    }
                } else {
                    serverLog('error', 'Failed to load catalog schema', { status: response.status });
                }
            } catch (error) {
                serverLog('error', 'Schema load error', { error: error.message });
            }

            updateUploadButton();
        }

        function selectMode(mode) {
            selectedMode = mode;
            serverLog('info', 'Mode selected', { mode });

            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.mode-btn').classList.add('active');

            // Show/hide entire product info section based on mode
            const productInfoSection = document.getElementById('productInfoSection');
            const metadataContainer = document.getElementById('metadataContainer');

            if (mode === 'mode1') {
                // Mode 1: Visual only - no metadata fields at all
                productInfoSection.style.display = 'none';
                metadataContainer.classList.remove('visible');
            } else if (mode === 'mode3') {
                // Mode 3: Visual + Metadata - show product info section
                productInfoSection.style.display = 'block';

                // Show dynamic metadata fields only if catalog schema is loaded
                if (currentCatalogSchema && currentCatalogSchema.metadata_fields) {
                    serverLog('info', 'Showing metadata container', {
                        fieldsCount: currentCatalogSchema.metadata_fields.length
                    });
                    metadataContainer.classList.add('visible');
                } else {
                    serverLog('info', 'No catalog schema loaded yet, metadata hidden');
                    metadataContainer.classList.remove('visible');
                }
            }

            updateUploadButton();
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            serverLog('info', 'File selected', {
                hasFile: !!selectedFile,
                fileName: selectedFile?.name,
                fileSize: selectedFile?.size
            });

            if (selectedFile) {
                document.getElementById('fileName').textContent = selectedFile.name;

                // Auto-populate filename in metadata field if it exists
                const filenameInput = document.getElementById('meta_filename');
                if (filenameInput && !filenameInput.value) {
                    // Remove file extension and set as filename
                    const nameWithoutExt = selectedFile.name.replace(/\.[^/.]+$/, '');
                    filenameInput.value = nameWithoutExt;
                    serverLog('info', 'Auto-populated filename metadata', { filename: nameWithoutExt });
                }

                // FIX: Clear old preview to prevent memory leak
                const previewImg = document.getElementById('previewImage');
                const previewContainer = document.getElementById('imagePreview');
                if (previewImg.src && previewImg.src.startsWith('data:')) {
                    previewImg.src = ''; // Clear old data URL
                }

                // Show image preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.classList.add('visible');
                    serverLog('info', 'Image preview displayed');
                };
                reader.onerror = function() {
                    reader.abort();
                    serverLog('error', 'Failed to read image file');
                };
                reader.readAsDataURL(selectedFile);
            }

            updateUploadButton();
        }

        async function updateMetadataFields() {
            if (!currentCatalogSchema) {
                serverLog('warning', 'updateMetadataFields: No catalog schema loaded');
                return;
            }

            if (!currentCatalogSchema.metadata_fields) {
                serverLog('warning', 'updateMetadataFields: No metadata_fields in schema');
                return;
            }

            const container = document.getElementById('metadataFields');

            // FIX: Explicitly remove all child nodes for better memory cleanup
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            if (currentCatalogSchema.metadata_fields.length === 0) {
                serverLog('warning', 'Catalog has 0 metadata fields - only base fields will show');
                // Show base fields when no metadata available
                document.getElementById('baseFields').style.display = 'block';
                return;
            }

            // Hide base fields when metadata fields are available
            document.getElementById('baseFields').style.display = 'none';

            // PERFORMANCE FIX: Use cached categories instead of fetching again
            const categories = cachedCategories || [];

            if (categories.length === 0) {
                serverLog('warning', 'No cached categories available for dropdown');
            } else {
                serverLog('info', 'Using cached categories', { count: categories.length });
            }

            const fieldNames = currentCatalogSchema.metadata_fields.map(f =>
                `${f.column_name}(${f.data_type})`
            );

            serverLog('info', 'Creating metadata input fields', {
                count: currentCatalogSchema.metadata_fields.length,
                fields: fieldNames,
                categoriesAvailable: categories.length
            });

            // PERFORMANCE FIX: Use DocumentFragment for batch DOM updates (single reflow)
            const fragment = document.createDocumentFragment();

            currentCatalogSchema.metadata_fields.forEach((field, index) => {
                const fieldDiv = document.createElement('div');
                fieldDiv.className = 'metadata-field';

                const label = document.createElement('label');
                label.textContent = field.display_name || field.column_name;

                // PERFORMANCE FIX: Hoist toLowerCase() outside conditional
                const fieldNameLower = field.column_name.toLowerCase();

                // CATEGORY DROPDOWN: Use cached categories
                if (fieldNameLower === 'category' && categories.length > 0) {
                    const select = document.createElement('select');
                    select.id = `meta_${field.column_name}`;
                    // PERFORMANCE FIX: Use CSS class instead of inline styles
                    select.className = 'metadata-select';

                    // Add empty option
                    const emptyOption = document.createElement('option');
                    emptyOption.value = '';
                    emptyOption.textContent = '-- Select Category --';
                    select.appendChild(emptyOption);

                    // Add category options
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat;
                        select.appendChild(option);
                    });

                    fieldDiv.appendChild(label);
                    fieldDiv.appendChild(select);
                    serverLog('info', 'Created category dropdown from cache', {
                        categoriesCount: categories.length
                    });
                } else {
                    // Regular text or number input
                    const input = document.createElement('input');
                    input.type = field.data_type === 'numeric' ? 'number' : 'text';
                    input.id = `meta_${field.column_name}`;
                    input.placeholder = `Optional`;

                    fieldDiv.appendChild(label);
                    fieldDiv.appendChild(input);
                }

                // Append to fragment instead of directly to DOM
                fragment.appendChild(fieldDiv);
            });

            // PERFORMANCE FIX: Single DOM append for all fields (one reflow instead of N)
            container.appendChild(fragment);

            serverLog('info', 'Metadata fields created successfully');
        }

        function updateUploadButton() {
            if (!domCache) return; // FIX: Guard for DOM cache

            const canUpload = !!(selectedFile && selectedCatalog && selectedMode);
            domCache.uploadBtn.disabled = !canUpload;

            const state = {
                hasFile: !!selectedFile,
                hasCatalog: !!selectedCatalog,
                hasMode: !!selectedMode,
                buttonEnabled: canUpload
            };

            serverLog('info', 'Upload button state updated', state);
        }

        // MEMORY LEAK FIX: Compress images with proper cleanup
        async function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = function(e) {
                    const img = new Image();

                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > maxWidth) {
                                height = (height * maxWidth) / width;
                                width = maxWidth;
                            }

                            canvas.width = width;
                            canvas.height = height;

                            // Use alpha: false for better JPEG performance
                            const ctx = canvas.getContext('2d', { alpha: false });
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((blob) => {
                                // MEMORY CLEANUP: Release canvas and image resources
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                canvas.width = 0;
                                canvas.height = 0;
                                img.src = ''; // Release image memory

                                resolve(new File([blob], file.name, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                }));
                            }, 'image/jpeg', quality);
                        } catch (error) {
                            img.src = '';
                            reject(error);
                        }
                    };

                    img.onerror = function() {
                        img.src = '';
                        reject(new Error('Failed to load image'));
                    };

                    img.src = e.target.result;
                };

                reader.onerror = function() {
                    reader.abort();
                    reject(new Error('Failed to read file'));
                };

                reader.readAsDataURL(file);
            });
        }

        async function uploadProduct() {
            if (!selectedFile || !selectedCatalog || !selectedMode || !authToken) {
                showMessage('messageContainer', 'Fill all required fields', 'error');
                return;
            }

            if (!domCache) return; // Guard for DOM cache

            domCache.loadingIndicator.classList.add('visible');
            domCache.uploadBtn.disabled = true;

            let formData = null; // FIX: Track for cleanup

            try {
                // FIX: Compress image before upload for better mobile performance
                const compressedFile = await compressImage(selectedFile);
                serverLog('info', 'Image compressed', {
                    original: selectedFile.size,
                    compressed: compressedFile.size,
                    reduction: ((1 - compressedFile.size / selectedFile.size) * 100).toFixed(1) + '%'
                });

                formData = new FormData();
                formData.append('image', compressedFile);
                formData.append('catalog_id', selectedCatalog);
                formData.append('mode', selectedMode);

                // Add product info fields only for mode3
                if (selectedMode === 'mode3') {
                    // FIX: Check if metadata fields exist first, otherwise use base fields
                    // When catalog has metadata_schema, base fields are hidden and metadata fields are used
                    const hasMetadataFields = currentCatalogSchema && currentCatalogSchema.metadata_fields && currentCatalogSchema.metadata_fields.length > 0;

                    if (hasMetadataFields) {
                        // Use metadata fields (dynamically created)
                        currentCatalogSchema.metadata_fields.forEach(field => {
                            const fieldId = `meta_${field.column_name}`;
                            const element = document.getElementById(fieldId);
                            const value = element?.value;

                            if (value && value.trim() !== '') {
                                // Special handling for core fields (category, sku, name)
                                if (field.column_name.toLowerCase() === 'category') {
                                    formData.append('category', value);
                                    serverLog('info', 'Category from metadata field', { category: value });
                                } else if (field.column_name.toLowerCase() === 'sku') {
                                    formData.append('sku', value);
                                } else if (field.column_name.toLowerCase() === 'name' || field.column_name.toLowerCase() === 'product_name') {
                                    formData.append('product_name', value);
                                } else {
                                    // All other metadata fields
                                    formData.append(`metadata_${field.column_name}`, value);
                                }
                            }
                        });
                    } else {
                        // Use base fields (when no metadata schema exists)
                        formData.append('category', document.getElementById('category').value);
                        formData.append('product_name', document.getElementById('productName').value);
                        formData.append('sku', document.getElementById('sku').value);
                    }
                }

                const response = await fetch('/api/mobile/upload-and-match', {
                    method: 'POST',
                    headers: { 'X-Mobile-Session': authToken },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage('messageContainer', data.error || 'Upload failed', 'error');
                } else {
                    showMessage('messageContainer',
                        `Product uploaded! Found ${data.match_count} matches`,
                        'success'
                    );

                    // Display results
                    displayResults(data.mobile_result || data);

                    // Notify main app that mobile results are ready via API
                    try {
                        fetch('/api/mobile/results-ready', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Mobile-Session': authToken
                            }
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log('📱 [MOBILE] Main app notified via API');
                        })
                        .catch(error => {
                            console.warn('Could not notify main app:', error);
                        });
                    } catch (error) {
                        console.warn('Could not notify main app:', error);
                    }

                    // Reset form
                    selectedFile = null;
                    domCache.photoInput.value = '';
                    domCache.fileName.textContent = '';
                    domCache.imagePreview.classList.remove('visible');
                    domCache.previewImage.src = ''; // FIX: Clear preview URL
                    updateUploadButton();
                }
            } catch (error) {
                console.error('Upload error:', error);
                showMessage('messageContainer', 'Upload failed', 'error');
            } finally {
                // FIX: Explicitly clear FormData and file reference for memory cleanup
                formData = null;

                domCache.loadingIndicator.classList.remove('visible');
                domCache.uploadBtn.disabled = false;
            }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getScoreClass(score) {
            const numeric = Number(score) || 0;
            if (numeric >= 70) return 'score-high';
            if (numeric >= 50) return 'score-medium';
            return 'score-low';
        }

        function renderMetadataScoresHtml(metadataScores, metadataValues) {
            if (!metadataScores || typeof metadataScores !== 'object') return '';

            const entries = Object.entries(metadataScores)
                .filter(([_, score]) => score !== undefined && score !== null)
                .slice(0, 4);

            if (entries.length === 0) return '';

            const numericFields = new Map();
            if (metadataValues && typeof metadataValues === 'object') {
                for (const [key, value] of Object.entries(metadataValues)) {
                    if (value === undefined || value === null) continue;
                    const parsed = parseFloat(value);
                    if (!Number.isNaN(parsed) && Number.isFinite(parsed)) {
                        numericFields.set(key, parsed);
                    }
                }
            }

            const tagsHtml = entries.map(([key, score]) => {
                const shortKey = escapeHtml(String(key).substring(0, 3).toUpperCase());
                if (numericFields.has(key)) {
                    const numValue = numericFields.get(key);
                    const formatted = numValue >= 1000
                        ? numValue.toLocaleString('en-US', { maximumFractionDigits: 0 })
                        : numValue.toFixed(1);
                    return `<span class="metadata-tag" title="${escapeHtml(key)}: ${escapeHtml(formatted)}">${shortKey}: ${escapeHtml(formatted)}</span>`;
                }
                const pct = Number(score).toFixed(0);
                return `<span class="metadata-tag" title="${escapeHtml(key)}: ${pct}% match">${shortKey}: ${pct}%</span>`;
            }).join('');

            const moreTag = Object.keys(metadataScores).length > 4 ? '<span class="metadata-tag">+MORE</span>' : '';
            return `<div class="match-metadata-scores">${tagsHtml}${moreTag}</div>`;
        }

        function renderMobileMatchCard(match, index) {
            const similarityScore = Number(match.similarity_score ?? match.score ?? 0);
            const scoreClass = getScoreClass(similarityScore);
            const duplicateBadge = similarityScore > 90 ? '<span class="duplicate-badge">DUPLICATE?</span>' : '';
            const metadataScoresHtml = renderMetadataScoresHtml(match.metadata_scores, match.metadata_values);

            const imageHtml = match.image_url
                ? `<img src="${escapeHtml(match.image_url)}" class="match-image" alt="Match ${index + 1}" loading="lazy">`
                : `<div class="match-image" style="display:flex;align-items:center;justify-content:center;font-size:11px;">No Image</div>`;

            const fileLine = match.filename
                ? `<div style="opacity:0.8;">${escapeHtml(match.filename)}</div>`
                : '';

            const hybridLine = (match.visual_score !== undefined && match.metadata_score !== undefined)
                ? `<div style="margin-top:2px;">V:${Number(match.visual_score).toFixed(1)}% | M:${Number(match.metadata_score).toFixed(1)}%</div>`
                : '';

            return `
                <div class="match-card">
                    ${imageHtml}
                    <div class="match-score ${scoreClass}">${similarityScore.toFixed(1)}%</div>
                    ${duplicateBadge}
                    <div class="match-info">
                        <div class="match-name">${escapeHtml(match.name || `Match #${index + 1}`)}</div>
                        <div>${escapeHtml(match.category || 'Uncategorized')}</div>
                        ${match.sku ? `<div>SKU: ${escapeHtml(match.sku)}</div>` : ''}
                        ${fileLine}
                        ${hybridLine}
                        ${metadataScoresHtml}
                    </div>
                </div>
            `;
        }

        function displayResults(resultData) {
            const container = document.getElementById('resultsContainer');
            const resultsDiv = document.getElementById('matchResults');

            const group = Array.isArray(resultData)
                ? { matches: resultData, query_product: null, mode: selectedMode }
                : (resultData || {});

            const matches = Array.isArray(group.matches) ? group.matches : [];
            const queryProduct = group.query_product || {};
            const mode = group.mode || selectedMode || '';

            const summaryTop = Number(group.summary?.top_score ?? (matches[0]?.similarity_score ?? matches[0]?.score ?? 0));
            const summaryAvg = Number(group.summary?.average_score ?? (
                matches.length ? matches.reduce((sum, m) => sum + Number(m.similarity_score ?? m.score ?? 0), 0) / matches.length : 0
            ));
            const summaryCount = Number(group.summary?.total_matches ?? matches.length);

            const modeLabel = mode === 'mode3' ? 'Visual + Metadata' : 'Visual Only';

            const queryImageHtml = queryProduct.image_url
                ? `<img src="${escapeHtml(queryProduct.image_url)}" class="result-image" alt="Uploaded product" loading="lazy">`
                : '';

            resultsDiv.innerHTML = `
                <div class="result-item">
                    <div class="result-header">
                        ${queryImageHtml}
                        <div class="result-info">
                            <h3>${escapeHtml(queryProduct.name || 'Uploaded Product')}</h3>
                            <div class="result-meta">
                                Category: ${escapeHtml(queryProduct.category || 'Uncategorized')}
                                ${queryProduct.sku ? ` | SKU: ${escapeHtml(queryProduct.sku)}` : ''}
                                <br>
                                Mode: ${escapeHtml(modeLabel)}
                            </div>
                        </div>
                    </div>

                    <div class="result-summary">
                        <div class="result-summary-item">
                            <span class="value">${summaryCount}</span>
                            <span class="label">Matches</span>
                        </div>
                        <div class="result-summary-item">
                            <span class="value">${summaryTop.toFixed(1)}%</span>
                            <span class="label">Top Score</span>
                        </div>
                        <div class="result-summary-item">
                            <span class="value">${summaryAvg.toFixed(1)}%</span>
                            <span class="label">Average</span>
                        </div>
                    </div>

                    ${matches.length > 0
                        ? `<div class="matches-grid">${matches.map((match, idx) => renderMobileMatchCard(match, idx)).join('')}</div>`
                        : '<div class="no-matches">No matches found</div>'
                    }
                </div>
            `;

            container.style.display = 'block';
            container.classList.add('visible');
        }

        function showMessage(containerId, message, type) {
            // FIX: Clear existing timeout to prevent memory leak
            if (messageTimeout) {
                clearTimeout(messageTimeout);
                messageTimeout = null;
            }

            const container = document.getElementById(containerId);
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            messageEl.textContent = message;
            container.innerHTML = '';
            container.appendChild(messageEl);

            if (type === 'success') {
                messageTimeout = setTimeout(() => {
                    container.innerHTML = '';
                    messageTimeout = null;
                }, 5000);
            }
        }
    </script>

    <!-- Initialize Lucide Icons with enhanced error handling -->
    <script>
        // Lightweight icon manager for mobile page
        window.reinitIcons = function() {
            if (typeof lucide !== 'undefined') {
                try {
                    lucide.createIcons();
                } catch (e) {
                    console.error('[LUCIDE] Icon re-initialization failed:', e);
                }
            }
        };

        (function() {
            function initIcons() {
                if (typeof lucide === 'undefined') {
                    console.warn('[LUCIDE] Failed to load Lucide icons library');
                    return;
                }

                try {
                    lucide.createIcons();
                } catch (e) {
                    console.error('[LUCIDE] Icon initialization failed:', e);
                }
            }

            // Initialize immediately if DOM is ready, otherwise wait
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initIcons, { once: true });
            } else {
                initIcons();
            }
        })();
    </script>
